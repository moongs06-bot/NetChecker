<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NetChecker · 로그인</title><link rel="stylesheet" href="portal.css"></head><body class="login-page"><div class="login-grid" aria-hidden="true"></div><main class="login-layout"><section class="login-brand"><div class="brand-mark">N</div><p class="eyebrow">NETWORK SECURITY WORKSPACE</p><h1>NetChecker</h1><p>네트워크의 변화를 발견하고<br>근거를 바탕으로 다음 행동을 준비합니다.</p><div class="login-pills"><span>실시간 관제</span><span>AI 원인 조사</span><span>조치 후 개선 확인</span></div></section><section class="login-card"><h2>로그인</h2><p>계정 정보를 입력하여 서비스를 이용하세요.</p><form id="loginform"><label for="username">아이디</label><input id="username" name="username" autocomplete="username" placeholder="아이디를 입력하세요" required maxlength="100"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력하세요" required maxlength="256"><label class="remember"><input id="remember" type="checkbox"> 아이디 저장</label><p id="loginerror" role="alert"></p><button type="submit" id="loginbutton">로그인</button></form><p class="login-help">비밀번호를 잊으셨다면 시스템 관리자에게 문의해주세요.</p></section></main><footer class="login-footer">NetChecker · 사내 네트워크 보안 분석</footer><script>
const form=document.getElementById('loginform'),user=document.getElementById('username'),remember=document.getElementById('remember');try{user.value=localStorage.getItem('nc_username')||'';remember.checked=!!user.value}catch(e){}
form.onsubmit=async e=>{e.preventDefault();const b=document.getElementById('loginbutton'),error=document.getElementById('loginerror');b.disabled=true;error.textContent='';try{const r=await fetch('api/login',{method:'POST',headers:{'Content-Type':'application/json','X-NetChecker':'1'},body:JSON.stringify({username:user.value,password:document.getElementById('password').value})});const v=await r.json();if(!r.ok)throw Error(typeof v.detail==='string'?v.detail:'로그인 정보를 확인해주세요.');try{if(remember.checked)localStorage.setItem('nc_username',user.value);else localStorage.removeItem('nc_username')}catch(e){}const report=new URLSearchParams(location.search).get('report');location.replace('./'+(report&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(report)?'?report='+encodeURIComponent(report):''))}catch(e){error.textContent=e.message}finally{b.disabled=false}};
</script></body></html>
